name: aari_ai_designer
description: "Aari AI Designer — premium AI-powered Aari embroidery visualization app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Auth + backend-as-a-service
  supabase_flutter: ^2.8.0

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # UI / UX
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  fl_chart: ^0.69.2
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  gal: ^2.3.0
  flutter_staggered_animations: ^1.1.1

  # Storage / persistence
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  go_router: ^14.6.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
